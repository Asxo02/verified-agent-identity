name: Verify Human Identity
on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Asxo02'
        required: true
        default: 'Asxo02'
      agent_description:
        description: 'Asxo02'
        required: true
        default: 'Asxo02 AI Agent'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity
      - name: Install script dependencies
        run: |
          cd scripts
          npm install
      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js
      - name: Step 3 - Link Human to Agent
  env:
    CHALLENGE_DATA: '{"name": "Asxo02", "description": "Asxo02 AI Agent"}'
  run: node scripts/manualLinkHumanToAgent.js --challenge "$CHALLENGE_DATA"
